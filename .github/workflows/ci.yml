name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  Run-CI-Checks:
    name: Run CI check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Type Check
        run: npm run type-check

  Run-Vendor-Checks:
    name: Vendor
    needs: [Run-CI-Checks]
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    uses: ./.github/workflows/vendor.yml

  Run-Implementor-Checks:
    name: Implementor
    needs: [Run-CI-Checks]
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    uses: ./.github/workflows/implementor.yml

  deploy-vendor-feature-branch-to-aws:
    name: Feature Branch Deploy
    needs: [Run-CI-Checks, Run-Vendor-Checks, Run-Implementor-Checks]
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    uses: ./.github/workflows/deploy-vendor-feature-branch-to-aws.yml

