version: 2

# Cooldown: delays version update PRs until a new release has been published
# for a minimum number of days. This mitigates supply chain attacks by giving
# the community and security vendors time to flag compromised packages.
# Security updates (GitHub Advisory) bypass cooldown and are always immediate.
#
# Day values:
#   patch (1 day)  - low risk; 1 day catches yanked/compromised releases
#   minor (3 days) - gives the community time to surface regressions
#   major (7 days) - breaking changes need more scrutiny; a week lets early
#                    adopters shake out issues before we upgrade

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    groups:
      dev-deps:
        dependency-type: development
      prod-deps:
        dependency-type: production
    target-branch: main
    labels:
      - direct-dependency-update
      - javascript
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7"]
    commit-message:
      prefix: BAU

  - package-ecosystem: "docker"
    directory: "/tests"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      dev-deps:
        patterns:
          - "*"
    target-branch: main
    labels:
      - direct-dependency-update
      - docker
    commit-message:
      prefix: BAU

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions-deps:
        patterns:
          - "*"
    target-branch: main
    labels:
      - direct-dependency-update
      - github_actions
    commit-message:
      prefix: BAU
